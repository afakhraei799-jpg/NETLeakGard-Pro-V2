# پیکربندی Cloudflare Workers + Static Assets برای NETLeakGuard Pro V2 (پلن رایگان / Free Tier)
# نکتهٔ امنیتی مهم: هیچ توکن یا کلید محرمانه‌ای را در این فایل قرار ندهید!
# توکن‌های محرمانه صرفاً از طریق دستور `npx wrangler secret put` در کلادفلر ثبت می‌شوند.

name = "netleakguard-pro-v2"
main = "worker.ts"
compatibility_date = "2025-02-01"
workers_dev = true

# سرو کردن فایل‌های استاتیک بیلدشدهٔ فرانت‌اند (پوشهٔ dist) همراه با API در یک Worker واحد
[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# متغیرهای غیرمحرمانه:
# تا قبل از راه‌اندازی و تأیید شنوندهٔ واقعی UDP/53 برای Authoritative DNS،
# مقدار DNS_LEAK_DOMAIN باید خالی ("") و DNS_UDP53_VERIFIED باید "false" باقی بماند
# تا وضعیت تست DNS در برنامه به درستی «پیکربندی نشده» (NOT_CONFIGURED) نمایش داده شود.
[vars]
DNS_LEAK_DOMAIN = ""
DNS_UDP53_VERIFIED = "false"

# اتصال به فضای ذخیره‌سازی رایگان Cloudflare KV (پس از اجرای دستور ایجاد KV، بخش زیر را از حالت کامنت خارج کرده و id واقعی خود را جایگزین کنید):
# دستور ساخت: npx wrangler kv namespace create DNS_LOGS_KV
# [[kv_namespaces]]
# binding = "DNS_LOGS_KV"
# id = "<YOUR_KV_NAMESPACE_ID_FROM_WRANGLER>"
